# 前端 CI：调用 governance 可复用工作流 + 镜像发布 + E2E 通知
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: harness-demo/harness-governance/.github/workflows/ci-node.yml@main
    with:
      filter: '@harness-demo/frontend'
    secrets: inherit

  publish-image:
    name: 发布 Docker 镜像
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  notify-e2e:
    name: 通知 E2E 测试
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GOVERNANCE_REPO_TOKEN }}
          repository: harness-demo/harness-governance
          event-type: run-e2e
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "source_ref": "main",
              "source_sha": "${{ github.sha }}",
              "fe_ref": "${{ github.sha }}"
            }
