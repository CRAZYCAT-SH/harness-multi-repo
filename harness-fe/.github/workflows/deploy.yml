# 前端部署工作流：手动触发，支持 staging 和 production
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: '部署版本（production 必填）'
        type: string
        default: 'latest'

jobs:
  staging:
    if: inputs.environment == 'staging'
    uses: harness-demo/harness-governance/.github/workflows/deploy-staging.yml@main
    with:
      service-name: frontend
      build-command: 'pnpm build'
      artifact-path: dist/
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  production:
    if: inputs.environment == 'production'
    uses: harness-demo/harness-governance/.github/workflows/deploy-production.yml@main
    with:
      service-name: frontend
      version: ${{ inputs.version }}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
